services:
  postgres:
    image: postgres:16
    container_name: resume_builder_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resume_builder
    ports:
      - "5432:5432"
    volumes:
      - resume_builder_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resume_builder"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-server:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    container_name: resume_builder_api
    ports:
      - "3001:3001"
    env_file:
      - ./artifacts/api-server/.env
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/resume_builder
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  resume_builder_pgdata:
